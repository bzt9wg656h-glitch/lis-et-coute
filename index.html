<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f8fc"><link rel="manifest" href="manifest.webmanifest"><title>ClairLire — Mes documents</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#1c344e;background:#f5f8fc}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dce5ed;padding:16px max(18px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:1.5rem;margin:0}h2{font-size:1.2rem}main{max-width:1100px;margin:auto;padding:20px}.muted{color:#52677a}.panel{background:#fff;border:1px solid #e1e8f0;border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 3px 14px #15385b08}button,.btn{border:0;background:#2469ad;color:#fff;padding:13px 17px;border-radius:12px;font:inherit;font-weight:650;cursor:pointer;display:inline-block}button.secondary,.btn.secondary{background:#e9f1fa;color:#1c527f}button.danger{background:#fff0ed;color:#a43b2e}button:disabled{opacity:.5}input,select,textarea{font:inherit;padding:12px;border:1px solid #b9c9d8;border-radius:10px;max-width:100%;width:100%}label{display:block;font-weight:600;margin:10px 0 5px}.actions{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.tile{background:#f1f7fc;color:#1b4569;text-align:left;min-height:110px}.tile .emoji{font-size:2rem;display:block}.tile small{display:block;font-weight:400;margin-top:6px}.hidden{display:none!important}.viewer{position:relative;overflow:auto;background:#e6edf4;border-radius:14px;padding:12px;max-height:70vh}.page{position:relative;margin:0 auto 15px;width:max-content;max-width:none;background:white;box-shadow:0 2px 10px #0002}.page canvas,.page img{display:block}.overlay{position:absolute;inset:0;pointer-events:none}.hl{position:absolute;border-radius:2px;pointer-events:none}.hl.sentence{background:#72b5f080}.hl.word{background:#ffce52b8;box-shadow:0 0 0 1px #e2a42b}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar button{min-width:95px}.status{padding:10px;border-radius:10px;background:#f0f5fa;margin:12px 0}.text-page{white-space:pre-wrap;background:white;padding:30px;line-height:1.8;min-height:200px;max-width:800px}.text-page span{white-space:pre-wrap}.text-page .active-sentence{background:#c9e3ff}.text-page .active-word{background:#ffd96c}.modal{position:fixed;inset:0;background:#0d203a88;display:grid;place-items:center;padding:15px;z-index:10}.modal .panel{width:min(480px,100%);max-height:90vh;overflow:auto}.help{font-size:.9rem;line-height:1.5}#fileInput{display:none}@media(max-width:600px){main{padding:12px}.panel{padding:15px}header{padding:14px}button{padding:12px}}
</style></head><body><header><div><h1>📖 ClairLire</h1><div class="muted">Lire mes documents, à mon rythme</div></div><button class="secondary" id="homeBtn">Ma bibliothèque</button></header><main><section id="libraryView"><div class="panel"><h2>Ma bibliothèque</h2><p class="muted">Mes documents restent enregistrés sur cet appareil. Pensez à faire une sauvegarde.</p><div class="actions"><button id="newFolder">+ Nouvelle catégorie</button><button class="secondary" id="newText">✏️ Écrire un texte</button><button class="secondary" id="backupBtn">⬇ Sauvegarder</button><label class="btn secondary" for="restoreInput">⬆ Restaurer</label><input type="file" id="restoreInput" accept=".json,application/json" style="display:none"></div></div><div id="folders" class="grid"></div><div class="panel" style="margin-top:18px"><h2 id="folderTitle">Mes documents</h2><div class="actions"><label class="btn" for="fileInput">📄 Importer PDF ou photo</label><input id="fileInput" type="file" accept="application/pdf,image/*,.txt,text/plain"><button class="secondary" id="editFolder">Modifier la catégorie</button></div><div id="docs" class="grid" style="margin-top:16px"></div></div></section><section id="readerView" class="hidden"><div class="panel"><div class="actions"><button class="secondary" id="backBtn">← Retour</button><button id="playBtn">▶ Écouter</button><button class="secondary" id="pauseBtn">⏸ Pause</button><button class="secondary" id="stopBtn">■ Arrêter</button><button class="secondary" id="ocrBtn">🔎 Reconnaître le texte</button></div><div class="toolbar" style="margin-top:12px"><label for="speed" style="margin:0">Vitesse</label><select id="speed" style="width:110px"><option value="0.8">Lente</option><option value="1" selected>Normale</option><option value="1.15">Rapide</option></select><button class="secondary" id="renameBtn">Renommer</button><button class="secondary" id="saveDocBtn">Enregistrer</button><button class="danger" id="deleteBtn">Supprimer</button></div><div id="status" class="status" role="status">Prêt.</div><p class="help muted">Bleu : phrase lue. Jaune : mot en cours. Le suivi mot par mot dépend des événements transmis par la voix de l'appareil.</p><div id="viewer" class="viewer"></div><div id="textEditor" class="hidden"><label for="editText">Modifier le texte</label><textarea id="editText" rows="12"></textarea><button id="applyText">Appliquer les modifications</button></div></div></section></main><div id="modal" class="modal hidden"><div class="panel"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions" style="margin-top:18px"><button id="modalOk">Valider</button><button class="secondary" id="modalCancel">Annuler</button></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="app.js"></script></body></html>
